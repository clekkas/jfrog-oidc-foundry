name: Bootstrap mykp foundation state

# One-time initialization for the new mykp backend key. The apply identity writes only an empty
# Terraform state blob so the read-only plan identity can subsequently initialize the backend.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-state-bootstrap-mykp
  cancel-in-progress: false

jobs:
  seed:
    if: github.ref == 'refs/heads/main'
    name: Initialize empty mykp state
    environment: foundation-mykp
    runs-on: [self-hosted, linux, "${{ vars.RUNNER_LABEL || 'byor-private' }}"]
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      STATE_STORAGE_ACCOUNT: tfstateb173d2d85c34
      STATE_CONTAINER: foundation-tfstate
      STATE_KEY: registry-connection/mykp.tfstate
    steps:
      - name: Require main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::State bootstrap only runs from main (got $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Seed empty state only if absent
        shell: bash
        run: |
          exists="$(az storage blob exists \
            --auth-mode login \
            --account-name "$STATE_STORAGE_ACCOUNT" \
            --container-name "$STATE_CONTAINER" \
            --name "$STATE_KEY" \
            --query exists --output tsv)"
          if [ "$exists" = "true" ]; then
            echo "State blob already exists; leaving it untouched."
            exit 0
          fi
          if [ "$exists" != "false" ]; then
            echo "::error::Could not determine whether the state blob exists."
            exit 1
          fi

          state_file="$RUNNER_TEMP/mykp-empty.tfstate"
          python3 - "$state_file" <<'PY'
          import json
          import sys
          import uuid

          state = {
              "version": 4,
              "terraform_version": "1.9.8",
              "serial": 0,
              "lineage": str(uuid.uuid4()),
              "outputs": {},
              "resources": [],
              "check_results": None,
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(state, stream)
              stream.write("\n")
          PY

          az storage blob upload \
            --auth-mode login \
            --account-name "$STATE_STORAGE_ACCOUNT" \
            --container-name "$STATE_CONTAINER" \
            --name "$STATE_KEY" \
            --file "$state_file" \
            --overwrite false \
            --only-show-errors \
            --output none
          echo "Initialized empty state at $STATE_CONTAINER/$STATE_KEY. No Azure resources were applied."